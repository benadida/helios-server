{% extends "helios/templates/cryptobase.html" %}

{% block content %}
  <h2 class="title">{{election.name}} &mdash; New Trustee <span style="font-size:0.7em;">[<a href="{% url "election@trustees@view" election.uuid %}">cancel</a>]</span></h2>

{% if error %}
<p class="error" style="color: red;">{{error}}</p>
{% endif %}

<form method="post" action="">
<input type="hidden" name="csrf_token" value="{{csrf_token}}" />
Name: <input type="text" name="name" size="60" value="{{name|default:''}}" /><br /><br />
Email: <input type="text" name="email" size="60" value="{{email|default:''}}" /><br /><br />

<input class="button" type="submit" value="Add Trustee" />
</form>

{% endblock %}
